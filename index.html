<style>
/* ==================================================================
   FEUILLE DE STYLE — variables regroupées dans :root pour maintenance
   ================================================================== */
:root{
  --ink:#12292b;   /* couleur principale du texte / entête */
  --mut:#5b6f70;   /* texte secondaire */
  --bg:#f1f5f4;    /* fond général et panneau latéral */
  --card:#fff;     /* fond des cartes/sections */

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}

/* --- Barre supérieure : recherche, profil, géoloc, export CSV --- */
#header{height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;flex-wrap:nowrap}
#header h1{font-size:19px;margin:0 8px 0 0;white-space:nowrap}

/* --- Layout : panneau latéral (gauche) + carte (droite).

/* --- Composants du panneau --- */

.g{color:#1a9d5b}.o{color:#c98a00}.r{color:#d23f31}      /* vert / orange / rouge du code couleur 80-100 / 50-79 / 0-49 */
.conf{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0}.conf i{display:block;height:100%;background:var(--acc)}

tr.na td{color:#9aa9a8}
.kv{display:flex;justify-content:space-between;gap:12px;padding:2px 0}.kv span:last-child{text-align:right}

/* --- Marqueur "pin" personnalisé (divIcon), orienté -45° --- */
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin b{transform:rotate(45deg);color:#fff;font-size:13px}

.msg{padding:8px 10px;border-radius:6px;background:#fff4d6;margin-top:8px;font-size:13px} /* avertissement */
.ok{color:#1a9d5b}.ko{color:#d23f31}.wait{color:#9aa9a8}                                    /* statuts sources */
.leg{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--mut)}                  /* légende scores */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.cmp-score{font-weight:700}

@media(max-width:760px){#wrap{flex-direction:column-reverse}#side{width:100%;height:55%}#map{height:45%;flex:none}#header h1{display:none}}

<body>
<!-- ======================= BARRE SUPÉRIEURE ======================= -->
<div id="header">
<h1>KALITEVI</h1>
<input id="search" list="sugg" placeholder="Ville ou adresse en France…" autocomplete="off" aria-label="Rechercher un lieu">
<datalist id="sugg"></datalist>
<button id="bGo">Chercher</button>
<button id="bGeo">Ma position</button>
<select id="prof" aria-label="Profil">
  <option>Équilibré</option><option>Famille</option><option>Senior</option><option>Étudiant</option>
</select>
<button id="bCsv" title="Exporter les indicateurs du lieu courant en CSV">CSV</button>
</div>

<!-- ======================= LAYOUT PRINCIPAL ======================= -->
<div id="wrap">
  <div id="side">
    <div id="summary">
      <div class="big">--</div>
      <p class="mut">Cherchez une ville ou cliquez sur la carte. Le profil (en haut) ajuste les pondérations.</p>
      <div class="leg"><span><span class="dot" style="background:#1a9d5b"></span>Excellent 80-100</span><span><span class="dot" style="background:#d99a00"></span>Moyen 50-79</span><span><span class="dot" style="background:#d23f31"></span>Faible 0-49</span></div>
    </div>
    <div id="detail"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ======================================================================
   KALITEVI — indice de qualité de vie 0-100, 100 % APIs ouvertes sans clé
   ======================================================================

   ARCHITECTURE (fichier unique, aucune dépendance hors Leaflet) :

     1) CONFIGURATION  : thèmes, indicateurs, profils, miroirs Overpass, fonds de carte.
     2) UTILITAIRES     : fetch avec timeout/abort, distances, helpers.
     3) CARTE          : Leaflet, fonds IGN/OSM, marqueurs, POI, historique.
     4) SOURCES         : une fonction par API ouverte (voir tableau plus bas).
     5) SCORE           : compute() agrège tout en scores indicateur/thème/global.
     6) RENDU           : render() reconstruit le panneau latéral.
     7) CHARGEMENT      : load() orchestre les appels + affichage progressif.
     8) RECHERCHE       : géocodage IGN → geo.api.gouv → Nominatim (fallback).

   SOURCES UTILISÉES (toutes publiques, sans clé, CORS activé) :
     - geo.api.gouv.fr ......................... commune, population, densité
     - data.geopf.fr (Géocodage + WMTS) ........ recherche d'adresse, fonds de carte
     - nominatim.openstreetmap.org ............. géocodage de secours
     - overpass-api.de (+2 miroirs) ............ équipements OSM (POI)
     - air-quality-api.open-meteo.com .......... qualité de l'air (CAMS) + pollens
     - api.open-meteo.com ...................... UV, ensoleillement, altitude, climat
     - hubeau.eaufrance.fr ..................... qualité de l'eau potable (Hub'Eau)
     - georisques.gouv.fr ...................... risques naturels/technologiques, ICPE, CatNat
     - apidf-preprod.cerema.fr (DVF) ........... prix immobilier €/m²
     - apicarto.ign.fr ........................ zonage PLU + zones naturelles protégées

   LIMITES CONNUES :
     - ATMO France, transport.data.gouv.fr et l'API INSEE exigent un jeton
       même si leurs données sont open : non intégrées ici.
     - Géorisques et apicarto bloquent parfois les pages ouvertes en file://
       (CORS) : servir la page en HTTP(S) local.
     - Overpass peut être lent : 3 miroirs + 6 tentatives sont prévus.

   MAINTENANCE EXPRESS :
     - Ajouter un équipement  → nouvelle ligne dans I[] (champ q = clé/valeurs OSM).
     - Changer les poids      → champ w de chaque ligne de I[].
     - Ajuster un profil      → objet PROF.
     - Ajouter un thème        → clé dans TH (couleur) + t:'...' dans les indicateurs.
     - Ajouter une API        → fonction async dans §SOURCES, alimentée dans load().
   ====================================================================== */

/* ======================================================================
   1) CONFIGURATION
   ====================================================================== */
/* TH : couleurs par thème (clé = libellé affiché, valeur = couleur POI). */
const TH={Services:'#2563eb',Santé:'#dc2626',Mobilité:'#7c3aed',Environnement:'#16a34a',Risques:'#ea580c',Commerces:'#0891b2',Loisirs:'#db2777'};
/* GRP : numéro de requête Overpass par thème (1=services+santé, 2=mobilité,
   3=environnement+commerces+loisirs). Regrouper des thèmes = moins de requêtes. */
const GRP={Services:1,Santé:1,Mobilité:2,Environnement:3,Commerces:3,Loisirs:3};

/* I : les indicateurs du score.
   Champs d'une ligne :
     id  : identifiant interne (servira de clé dans PROF)
     l   : libellé affiché
     t   : thème (clé de TH)
     w   : poids de base en %
     q   : [[clé OSM, valeurs...]] (absent si indicateur API/bruit)
     r   : rayon de recherche en mètres
     i   : distance idéale (score 100 % de proximité en dessous)
     m   : distance max (score de proximité 0 au-delà)
     s   : saturation : nb d'équipements pour ~63 % du score de densité
     api:1 → valeur calculée par une API ; noise:1 → calcul du calme via OSM. */
const I=[
{id:'ecole',l:'Écoles et collèges',t:'Services',w:7,r:2500,i:400,m:2500,s:4,q:[['amenity','school'],['amenity','college']]},
{id:'creche',l:'Crèches et maternelles',t:'Services',w:4,r:2000,i:500,m:2000,s:2,q:[['amenity','kindergarten','childcare']]},
{id:'banque',l:'Banques et distributeurs',t:'Services',w:3,r:3000,i:600,m:3000,s:3,q:[['amenity','bank','atm']]},
{id:'poste',l:'Bureaux de poste',t:'Services',w:2,r:3000,i:800,m:3000,s:1,q:[['amenity','post_office']]},
{id:'public',l:'Mairie, police, pompiers',t:'Services',w:4,r:4000,i:800,m:4000,s:2,q:[['amenity','townhall','police','fire_station']]},
{id:'decheterie',l:'Déchèteries et recyclage',t:'Services',w:2,r:3000,i:700,m:3000,s:1,q:[['amenity','recycling','waste_transfer_station']]},
{id:'pharmacie',l:'Pharmacies',t:'Santé',w:6,r:2000,i:400,m:2500,s:2,q:[['amenity','pharmacy']]},
{id:'medecin',l:'Médecins et cliniques',t:'Santé',w:6,r:2500,i:500,m:3000,s:3,q:[['amenity','doctors','clinic']]},
{id:'hopital',l:'Hôpitaux et urgences',t:'Santé',w:5,r:15000,i:2000,m:15000,s:1,q:[['amenity','hospital']]},
{id:'dentiste',l:'Dentistes',t:'Santé',w:3,r:3000,i:600,m:3000,s:2,q:[['amenity','dentist']]},
{id:'arret',l:'Arrêts de bus, tram, métro',t:'Mobilité',w:7,r:1500,i:300,m:1500,s:5,q:[['highway','bus_stop'],['railway','tram_stop','station','halt','subway_entrance']]},
{id:'gare',l:'Gares (train)',t:'Mobilité',w:3,r:10000,i:1500,m:10000,s:1,q:[['railway','station','halt']]},
{id:'velo',l:'Pistes cyclables et vélos partagés',t:'Mobilité',w:3,r:2000,i:300,m:2000,s:6,q:[['highway','cycleway'],['amenity','bicycle_rental']]},
{id:'irve',l:'Bornes de recharge électrique',t:'Mobilité',w:2,r:3000,i:500,m:3000,s:2,q:[['amenity','charging_station']]},
{id:'air',l:'Qualité de l’air (IQEA)',t:'Environnement',w:5,api:1},
{id:'eau',l:'Qualité de l’eau potable',t:'Environnement',w:2,api:1},
{id:'pollens',l:'Pollens',t:'Environnement',w:2,api:1},
{id:'uv',l:'Index UV / ensoleillement',t:'Environnement',w:2,api:1},
{id:'vert',l:'Espaces verts',t:'Environnement',w:4,r:2000,i:300,m:2000,s:4,q:[['leisure','park','garden','nature_reserve'],['landuse','forest'],['natural','wood']]},
{id:'calme',l:'Calme (voies rapides, ferrées)',t:'Environnement',w:3,noise:1},
{id:'rnat',l:'Risques naturels',t:'Risques',w:6,api:1},
{id:'rtec',l:'Risques technologiques',t:'Risques',w:4,api:1},
{id:'super',l:'Supermarchés',t:'Commerces',w:4,r:3000,i:500,m:3000,s:2,q:[['shop','supermarket']]},
{id:'station',l:'Stations-service',t:'Commerces',w:2,r:3000,i:800,m:3000,s:2,q:[['amenity','fuel']]},
{id:'boul',l:'Boulangeries',t:'Commerces',w:3,r:2000,i:400,m:2000,s:2,q:[['shop','bakery']]},
{id:'prox',l:'Commerces de proximité et marchés',t:'Commerces',w:3,r:2000,i:400,m:2000,s:4,q:[['shop','convenience','butcher','greengrocer','deli','cheese','fishmonger'],['amenity','marketplace']]},
{id:'sport',l:'Équipements sportifs',t:'Loisirs',w:2,r:2500,i:500,m:2500,s:3,q:[['leisure','pitch','sports_centre','swimming_pool','fitness_centre']]},
{id:'culture',l:'Culture (cinéma, médiathèque, musée)',t:'Loisirs',w:1,r:3000,i:800,m:3000,s:2,q:[['amenity','library','cinema','theatre','arts_centre'],['tourism','museum']]},
{id:'resto',l:'Cafés et restaurants',t:'Loisirs',w:1,r:1500,i:300,m:1500,s:5,q:[['amenity','restaurant','cafe','bar']]},
{id:'jeux',l:'Aires de jeux',t:'Loisirs',w:1,r:1500,i:300,m:1500,s:2,q:[['leisure','playground']]}
];

/* PROF : multiplicateurs de poids par profil et par id d'indicateur.
   Équilibré = neutre (tous les multiplicateurs à 1 implicitement). */
const PROF={'Équilibré':{},Famille:{ecole:2,creche:2,vert:1.5,jeux:3,pharmacie:1.3,medecin:1.3,calme:1.5,resto:.5},
Senior:{pharmacie:1.8,medecin:1.8,hopital:1.8,arret:1.6,calme:1.8,vert:1.3,velo:.4,ecole:.3,creche:.2,jeux:.2},
Étudiant:{arret:1.8,velo:2,resto:2.5,culture:2.5,super:1.3,pharmacie:.7,medecin:.6,hopital:.5,ecole:.2,creche:.1,jeux:.2}};

/* Miroirs Overpass : rotation automatique en cas d'échec ou de timeout. */
const OVP=['https://overpass-api.de/api/interpreter','https://overpass.openstreetmap.fr/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter'];

/* Fonds de carte IGN (Géoplateforme, WMTS, sans clé) + OSM. */
const IGN=(l,f)=>`https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&LAYER=${l}&FORMAT=${f}&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}`;
const att='© IGN Géoplateforme';
const BASES={'Plan IGN':L.tileLayer(IGN('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png'),{maxZoom:18,attribution:att}),
'Photo aérienne IGN':L.tileLayer(IGN('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg'),{maxZoom:19,attribution:att}),
'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© contributeurs OpenStreetMap'})};
/* Calques optionnels (sélecteur de Leaflet, en surimpression). */
const OVERS={'Cadastre':L.tileLayer(IGN('CADASTRALPARCELS.PARCELLAIRE_EXPRESS','image/png'),{maxZoom:19,opacity:.8,attribution:att}),
'Pentes (relief)':L.tileLayer(IGN('ELEVATION.SLOPES','image/png'),{maxZoom:18,opacity:.55,attribution:att})};

/* ======================================================================
   2) UTILITAIRES
   ====================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); /* anti-XSS pour tout contenu injecté */
const cls=s=>s>=80?'g':s>=50?'o':'r';            /* classe CSS selon le score */
const col=s=>s>=80?'#1a9d5b':s>=50?'#d99a00':'#d23f31'; /* couleur selon le score */
const clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Distance approx. (mètres) entre deux points lat/lon — précision suffisante <20 km. */
function dist(a,b,c,d){const p=Math.PI/180,x=(c-a)*p,y=(d-b)*p*Math.cos((a+c)/2*p);return Math.sqrt(x*x+y*y)*6371000}
/* Distance (mètres) d'un point à une polyligne [{lat,lon}...] — pour le bruit. */
function dPoly(lat,lon,g){const k=Math.cos(lat*Math.PI/180),R=111320;let m=1e9;
for(let i=0;i<g.length-1;i++){const ax=(g[i].lon-lon)*k*R,ay=(g[i].lat-lat)*R,bx=(g[i+1].lon-lon)*k*R,by=(g[i+1].lat-lat)*R,dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(-(ax*dx+ay*dy)/l,0,1):0;m=Math.min(m,Math.hypot(ax+t*dx,ay+t*dy))}
return m}

/* État global :
   ctl/rid  : abort des requêtes en cours + id de la dernière recherche
   flt      : filtre de thème actif ('Tous' par défaut)
   last     : dernier lieu calculé {S,D,lat,lon,name,label}
   cache    : Map clé "lat,lon" → données brutes (évite de recharger un lieu)
   hist     : Map des lieux évalués, persistée en localStorage (comparateur) */
let ctl=null,rid=0,flt='Tous',last=null;const cache=new Map(),hist=new Map();
try{JSON.parse(localStorage.getItem('kalitevi-hist')||'[]').forEach(h=>hist.set(h.k,h))}catch(e){}

/* J : fetch avec timeout, annulation, et relance automatique (tries, sauf erreurs 400/401/403/404).
   o.text=1 → réponse texte (CSV) au lieu de JSON. */
async function J(u,o={},ms=25000,tries=2){
const{text,...oo}=o;let err;
for(let a=0;a<tries;a++){
const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
if(ctl)ctl.signal.addEventListener('abort',()=>c.abort());
try{const r=await fetch(u,{...oo,signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return text?await r.text():await r.json()}
catch(e){err=e;if(ctl&&ctl.signal.aborted)throw e;if(/HTTP (400|401|403|404)/.test(e.message))throw e;await sleep(700)}
finally{clearTimeout(t)}
}
throw err;
}
const safe=p=>p.catch(()=>null);        /* une source en échec ne bloque jamais les autres */
const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null}; /* médiane */

/* ======================================================================
   3) CARTE
   ====================================================================== */
const map=L.map('map',{layers:[BASES['Plan IGN']]}).setView([46.6,2.4],6);
L.control.layers(BASES,OVERS,{collapsed:true}).addTo(map);
let marker=null;                          /* pin principal (score du lieu courant) */
const poiLayer=L.layerGroup().addTo(map); /* POI des indicateurs (filtre par thème) */
const histLayer=L.layerGroup().addTo(map);/* lieux de l'historique (petits ronds) */
/* pin(score) : icône divIcon colorée selon le score ; null = en cours de calcul. */
const pin=s=>L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,34],html:`<div class="pin" style="background:${s==null?'#64748b':col(s)}"><b>${s==null?'…':s}</b></div>`});
/* drawHist : redessine les lieux mémorisés (clic = recharger ce lieu). */
function drawHist(){histLayer.clearLayers();hist.forEach(h=>{if(last&&h.k===last.S.key)return;L.circleMarker([h.lat,h.lon],{radius:6,color:'#fff',weight:2,fillColor:col(h.total),fillOpacity:.85}).bindTooltip(`${esc(h.name)} : ${h.total}/100`).on('click',()=>load(h.lat,h.lon,h.name)).addTo(histLayer)})}

/* ======================================================================
   4) SOURCES DE DONNÉES (une fonction par API)
   ====================================================================== */

/* --- Commune : nom, code INSEE, population, surface, EPCI, région --- */
const commune=async(lat,lon)=>{const d=await J(`https://geo.api.gouv.fr/communes?lat=${lat}&lon=${lon}&fields=nom,code,population,surface,codesPostaux,departement,region,epci&format=json`);return d&&d[0]||null};

/* --- Overpass : 2 requêtes simultanées maximum (limite des serveurs publics), rotation des miroirs,
   pause croissante. ovpErr garde la dernière cause d'échec pour l'afficher dans « Sources ». --- */

/* ===== Sources complémentaires (logement, fiscalité, numérique, culture, bruit aérien) — hors score ===== */
const cLayer=L.layerGroup().addTo(map); /* contour de la commune */
const ods=(base,ds,where,x='')=>J(`${base}/api/explore/v2.1/catalog/datasets/${ds}/records?where=${encodeURIComponent(where)}${x}`,{},15000);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fk=(o,re,pre)=>Object.keys(o||{}).find(h=>re.test(h)&&(!pre||pre.test(h))&&num(o[h])!=null);

async function ovp(body,mi=0,tries=3){

try{const d=await J(OVP[(a+mi)%OVP.length]+'?data='+encodeURIComponent(body),{},Math.min(25000,left-500),1);
if(d&&d.elements&&!(d.remark&&/timed out|out of memory|runtime error/i.test(d.remark)&&!d.elements.length))return d.elements;

for(const y of [Y-1,Y-2,Y-3]){try{rows=rows.concat(csvRows(await J(`https://files.data.gouv.fr/geo-dvf/latest/csv/${y}/communes/${dep}/${com.code}.csv`,{text:1},30000,1)))}catch(e){if(ctl.signal.aborted)throw e}}

/* scoreInd : score d'un indicateur OSM = 70 % proximité du plus proche

   + 30 % densité (1-exp(-n/s), n = nombre trouvés, s = saturation). */
function scoreInd(x,items){
if(!items.length)return 0;
const d=Math.min(...items.map(i=>i.d)),prox=d<=x.i?1:Math.max(0,1-(d-x.i)/(x.m-x.i)),dens=1-Math.exp(-items.length/x.s);
return Math.round(100*(.7*prox+.3*dens));
}
/* calme : pénalités cumulées selon la distance de la voie rapide / ferrée / principale. */
function calme(lat,lon,els){
const best={};
els.forEach(e=>{const t=e.tags||{};if(t.aeroway){const c=e.center;if(c){const d=dist(lat,lon,c.lat,c.lon);if(!('air' in best)||d<best.air)best.air=d}return}if(!e.geometry)return;const k=t.railway?'rail':/motorway|trunk/.test(t.highway)?'fast':'prim',d=dPoly(lat,lon,e.geometry);if(!(k in best)||d<best[k])best[k]=d});
const T={fast:[[100,60],[250,35],[500,15]],rail:[[100,40],[250,25],[500,10]],prim:[[50,20],[150,10]],air:[[1500,40],[3000,20]]},N={fast:'voie rapide',rail:'voie ferrée',prim:'route principale',air:'aérodrome (centre)'};
let p=0;const inf=[];
Object.keys(best).forEach(k=>{const r=T[k].find(([m])=>best[k]<=m);if(r){p+=r[1];inf.push(`${N[k]} à ${Math.round(best[k])} m`)}});
return{score:Math.round(clamp(100-p)),info:inf.length?inf.join(', '):'aucune source de bruit majeure à moins de 500 m'};
}
/* compute : agrège tous les indicateurs.
   Sortie : res (par indicateur : score, poids, poids renormalisé ew, contribution),
   pois (10 plus proches POI par indicateur), themes (moyenne pondérée par thème),
   total (moyenne pondérée), conf (part du poids réellement mesurée, -20 % si
   les données OSM sont très clairsemées), sparse. */
function compute(lat,lon,D,prof){
const res=[],pois=[],P=PROF[prof]||{};
I.forEach(x=>{
const r={x,score:null,info:'',w:x.w*(P[x.id]||1)};
if(x.api){ /* indicateurs API : air, eau, pollens, uv, risques */
const v=x.id==='air'?D.air:x.id==='eau'?D.eau:x.id==='pollens'?D.pol:x.id==='uv'?D.uv:D.risq&&(x.id==='rnat'?D.risq.nat:D.risq.tec);if(v){r.score=v.score;r.info=v.info}}
else if(x.noise){const e=D.els[3];if(e){const v=calme(lat,lon,e);r.score=v.score;r.info=v.info}}
else if(x.id==='ecole'&&D.edu&&!(D.els[0]&&D.els[0].ids&&D.els[0].ids.has('ecole'))){ /* secours : Annuaire de l'éducation nationale */
const items=D.edu.map(e=>({...e,d:dist(lat,lon,e.la,e.lo)})).filter(e=>e.d<=x.r).sort((a,b)=>a.d-b.d);
r.score=scoreInd(x,items);r.dmin=items.length?items[0].d:null;
r.info=items.length?`${items.length} établissement(s) (Éducation nationale), le plus proche à ${Math.round(items[0].d)} m`:`aucun dans ${x.r/1000} km`;
items.slice(0,10).forEach(i=>pois.push({d:i.d,la:i.la,lo:i.lo,name:i.name,theme:x.t,ind:x.l}))}
else{ /* indicateurs OSM : filtrage des éléments par clé/valeur + distance */
const els=D.els[GRP[x.t]-1];
if(els&&(!els.ids||els.ids.has(x.id))){
const items=[];
els.forEach(e=>{const t=e.tags||{};if(!x.q.some(([k,...v])=>v.includes(t[k])))return;const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(la==null)return;const d=dist(lat,lon,la,lo);if(d<=x.r)items.push({d,la,lo,name:t.name||x.l})});
r.score=scoreInd(x,items);r.dmin=items.length?Math.min(...items.map(i=>i.d)):null;
r.info=items.length?`${items.length} trouvé(s), le plus proche à ${Math.round(Math.min(...items.map(i=>i.d)))} m`:`aucun dans ${x.r>=1000?x.r/1000+' km':x.r+' m'}`;
items.sort((a,b)=>a.d-b.d).slice(0,10).forEach(i=>pois.push({...i,theme:x.t,ind:x.l}));
}}
res.push(r);
});
/* Renormalisation : les indicateurs sans donnée sont exclus du total. */
const av=res.filter(r=>r.score!=null),W=av.reduce((s,r)=>s+r.w,0),WT=res.reduce((s,r)=>s+r.w,0);
res.forEach(r=>{r.ew=r.score==null?0:r.w/W*100;r.contrib=r.score==null?0:r.score*r.ew/100});
const themes={};
Object.keys(TH).forEach(t=>{const a=av.filter(r=>r.x.t===t),w=a.reduce((s,r)=>s+r.w,0);themes[t]=w?Math.round(a.reduce((s,r)=>s+r.score*r.w,0)/w):null});
const Q15=['super','boul','pharmacie','medecin','ecole','arret','vert','banque'],qa=res.filter(r=>Q15.includes(r.x.id)&&r.dmin!==undefined),q15=qa.length>=4?{n:qa.filter(r=>r.dmin!=null&&r.dmin<=1000).length,t:qa.length}:null;
const sparse=D.els.slice(0,3).every(e=>e&&e.length)&&D.els.slice(0,3).reduce((s,e)=>s+e.length,0)<12;
return{key:lat.toFixed(4)+','+lon.toFixed(4),res,pois,q15,themes,total:W?Math.round(av.reduce((s,r)=>s+r.score*r.w,0)/W):null,conf:Math.round(W/WT*100*(sparse?.8:1)),sparse};
}

null,
run(5,()=>air(lat,lon)),run(6,()=>pollens(lat,lon)),run(7,()=>uv(lat,lon)),
run(8,()=>eau(com&&com.code)),
run(9,()=>risques(lat,lon,com&&com.code)),
run(10,()=>altitude(lat,lon)),run(11,()=>climat(lat,lon)),run(12,()=>dvf(lat,lon,com)),run(13,()=>urbanisme(lat,lon)),run(14,()=>nature(lat,lon)),run(15,()=>education(lat,lon)),run(16,()=>relief(lat,lon)),
run(17,()=>cd?loyers(cd):null),run(18,()=>cd?dpe(cd):null),run(19,()=>cd?fisc(cd):null),run(20,()=>cd?compt(cd):null),run(21,()=>cd?fibre(cd):null),
run(22,()=>cd?culture(cd):null),run(23,()=>cd?irve(cd):null),run(24,()=>cd?radon(cd):null),run(25,()=>peb(lat,lon)),run(26,()=>cd?contour(cd):null),
]);

const sg={};let tm; /* sg : suggestions mémorisées ; tm : debounce de la saisie */
/* Nominatim : dernier recours si IGN et geo.api ne trouvent rien. */
async function nominatim(q,n){try{const d=await J(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&countrycodes=fr&format=json&limit=${n}&addressdetails=0`,{},10000);return d.map(x=>({label:x.display_name.split(',').slice(0,3).join(', '),lon:+x.lon,lat:+x.lat}))}catch(e){return[]}}
/* Cascade : 1) Géocodage IGN  2) communes geo.api  3) Nominatim. */
async function geocode(q,n=6){
try{const d=await J(`https://data.geopf.fr/geocodage/search?q=${encodeURIComponent(q)}&limit=${n}`,{},10000);
const f=(d.features||[]).map(x=>({label:x.properties.label,lon:x.geometry.coordinates[0],lat:x.geometry.coordinates[1]}));if(f.length)return f}catch(e){}

return nominatim(q,n);

/* Autocomplétion (350 ms de debounce, 3 caractères minimum). */
$('search').addEventListener('input',()=>{clearTimeout(tm);const q=$('search').value.trim();if(q.length<3)return;
tm=setTimeout(async()=>{const f=await geocode(q);$('sugg').innerHTML='';f.forEach(x=>{sg[x.label]=x;const o=document.createElement('option');o.value=x.label;$('sugg').appendChild(o)})},350)});
/* Bouton "Chercher" / touche Entrée. */
async function go(){
const q=$('search').value.trim();if(!q)return;
const f=sg[q]?[sg[q]]:await geocode(q,1);
if(!f.length){$('summary').innerHTML='<div class="msg">Lieu introuvable. Essayez un nom de ville ou une adresse en France.</div>';return}
load(f[0].lat,f[0].lon,f[0].label);
}
$('bGo').onclick=go;
$('search').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
/* Géolocalisation navigateur (HTTPS requis). */
$('bGeo').onclick=()=>{
if(!navigator.geolocation){$('summary').innerHTML='<div class="msg">Géolocalisation indisponible sur ce navigateur.</div>';return}
navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude),()=>{$('summary').innerHTML='<div class="msg">Position refusée ou indisponible (HTTPS requis).</div>'},{timeout:10000});
};
/* URL partageable : recharge si on ouvre/revient sur un lien #lat,lon. */
window.addEventListener('hashchange',()=>{const h=location.hash.match(/^#(-?\d+\.\d+),(-?\d+\.\d+)$/);if(h)load(+h[1],+h[2])});
const h=location.hash.match(/^#(-?\d+\.\d+),(-?\d+\.\d+)$/);
if(h)load(+h[1],+h[2]);
</script>
